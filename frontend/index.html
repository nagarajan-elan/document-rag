<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowledge Base RAG</title>
    <style>
      :root {
        --bg: #08131f;
        --panel: #111d2d;
        --panel-alt: #0e1b2a;
        --sidebar: #0b1725;
        --surface: #16273d;
        --surface-soft: #1d3350;
        --text: #edf5ff;
        --muted: #9db0c6;
        --accent: #70d0ff;
        --accent-2: #7ef0c7;
        --border: rgba(146, 176, 214, 0.2);
        --danger: #ff7a7a;
        --shadow: 0 18px 45px rgba(7, 12, 18, 0.45);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        font-family: Inter, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #08131f 0%, #0d1e2d 100%);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        overflow: hidden;
      }

      button, input {
        font: inherit;
      }

      .app-shell {
        display: flex;
        width: 100%;
        height: 100vh;
      }

      .sidebar {
        width: 320px;
        min-width: 320px;
        background: rgba(11, 23, 37, 0.96);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        transition: width 0.2s ease, min-width 0.2s ease, transform 0.2s ease;
        box-shadow: var(--shadow);
        z-index: 2;
      }

      .sidebar.collapsed {
        width: 78px;
        min-width: 78px;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 16px 14px;
        border-bottom: 1px solid var(--border);
        gap: 10px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
        overflow: hidden;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display: grid;
        place-items: center;
        font-weight: 800;
        color: #06121d;
        cursor: pointer;
        padding: 0;
      }

      .brand-name {
        font-size: 0.98rem;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .sidebar.collapsed .brand-name,
      .sidebar.collapsed .chat-toolbar,
      .sidebar.collapsed .chat-list,
      .sidebar.collapsed .sidebar-header .icon-button,
      .sidebar.collapsed .chat-actions,
      .sidebar.collapsed .chat-item .rename-btn,
      .sidebar.collapsed .chat-item .archive-btn,
      .sidebar.collapsed .chat-item .delete-btn,
      .sidebar.collapsed .chat-item .chat-summary {
        display: none;
      }

      .sidebar.collapsed .sidebar-header {
        justify-content: center;
      }

      .sidebar.collapsed .brand {
        justify-content: center;
      }

      .sidebar:not(.collapsed) #toggleSidebar {
        display: none;
      }

      .sidebar.collapsed #toggleSidebarSecondary {
        display: none;
      }

      .ghost-button,
      .primary-button,
      .icon-button {
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.02);
        color: var(--text);
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease;
      }

      .ghost-button:hover,
      .primary-button:hover,
      .icon-button:hover {
        transform: translateY(-1px);
        background: rgba(112, 208, 255, 0.08);
      }

      .primary-button {
        border-color: rgba(112, 208, 255, 0.5);
        background: linear-gradient(135deg, rgba(112, 208, 255, 0.2), rgba(126, 240, 199, 0.18));
      }

      .icon-button {
        width: 34px;
        height: 34px;
        padding: 0;
        display: grid;
        place-items: center;
        font-size: 1rem;
      }

      .chat-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
      }

      .new-chat {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px 12px;
      }

      .archived-section {
        margin-top: auto;
        padding: 10px 12px 12px;
        border-top: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.015);
      }

      .archived-toggle {
        width: 100%;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.02);
        color: var(--text);
        border-radius: 10px;
        padding: 8px 10px;
        cursor: pointer;
        font-size: 0.8rem;
      }

      .chat-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px 10px 16px;
        scrollbar-width: thin;
        scrollbar-color: rgba(160, 180, 210, 0.38) transparent;
      }

      .chat-list::-webkit-scrollbar,
      .conversation::-webkit-scrollbar,
      .documents-view::-webkit-scrollbar,
      .document-list::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      .chat-list::-webkit-scrollbar-track,
      .conversation::-webkit-scrollbar-track,
      .documents-view::-webkit-scrollbar-track,
      .document-list::-webkit-scrollbar-track {
        background: transparent;
      }

      .chat-list::-webkit-scrollbar-thumb,
      .conversation::-webkit-scrollbar-thumb,
      .documents-view::-webkit-scrollbar-thumb,
      .document-list::-webkit-scrollbar-thumb {
        background: rgba(160, 180, 210, 0.35);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      .chat-list::-webkit-scrollbar-thumb:hover,
      .conversation::-webkit-scrollbar-thumb:hover,
      .documents-view::-webkit-scrollbar-thumb:hover,
      .document-list::-webkit-scrollbar-thumb:hover {
        background: rgba(160, 180, 210, 0.55);
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      .chat-item {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.02);
        border-radius: 12px;
        padding: 10px 10px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .chat-item:hover {
        background: rgba(112, 208, 255, 0.05);
      }

      .chat-item.active {
        background: rgba(112, 208, 255, 0.12);
        border-color: rgba(112, 208, 255, 0.35);
      }

      .chat-summary {
        min-width: 0;
        flex: 1;
      }

      .chat-title {
        font-weight: 600;
        font-size: 0.95rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .chat-meta {
        margin-top: 4px;
        font-size: 0.73rem;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .chat-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .rename-btn,
      .archive-btn,
      .delete-btn {
        width: 28px;
        height: 28px;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        background: rgba(255,255,255,0.03);
        color: var(--text);
        cursor: pointer;
      }

      .archive-btn {
        color: #dfefff;
      }

      .delete-btn {
        color: #ffb4b4;
        border-color: rgba(255, 122, 122, 0.35);
      }

      .empty-state {
        padding: 30px 18px;
        color: var(--muted);
        text-align: center;
        font-size: 0.9rem;
      }

      .main-panel {
        flex: 1;
        min-width: 0;
        background: linear-gradient(180deg, rgba(9, 16, 24, 0.84), rgba(12, 23, 34, 0.92));
        display: flex;
        flex-direction: column;
      }

      .main-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 24px 12px;
        border-bottom: 1px solid var(--border);
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .title-block {
        display: flex;
        flex-direction: column;
      }

      .title-label {
        color: var(--muted);
        font-size: 0.74rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .chat-name {
        font-size: clamp(1.15rem, 1.4vw, 1.5rem);
        font-weight: 700;
      }

      .main-header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .view-toggle {
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.02);
        color: var(--muted);
        border-radius: 10px;
        padding: 8px 12px;
        cursor: pointer;
        font-weight: 600;
      }

      .view-toggle.active {
        background: rgba(112, 208, 255, 0.12);
        border-color: rgba(112, 208, 255, 0.35);
        color: var(--text);
      }

      .main-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .conversation {
        flex: 1;
        overflow-y: auto;
        padding: 18px 22px 10px;
      }

      .documents-view {
        flex: 1;
        overflow-y: auto;
        padding: 18px 22px 10px;
      }

      .documents-view.hidden,
      .conversation.hidden {
        display: none;
      }

      .message-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-width: 920px;
        margin: 0 auto;
      }

      .message {
        max-width: 75%;
        min-width: 0;
        padding: 14px 16px;
        border-radius: 16px;
        line-height: 1.5;
        box-shadow: 0 12px 26px rgba(8, 12, 18, 0.28);
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .message > div {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .message.user {
        align-self: flex-end;
        background: linear-gradient(135deg, rgba(112, 208, 255, 0.22), rgba(126, 240, 199, 0.1));
        border-bottom-right-radius: 4px;
      }

      .message.assistant,
      .message.system {
        align-self: flex-start;
        background: rgba(24, 38, 58, 0.9);
        border: 1px solid rgba(146, 176, 214, 0.15);
        border-bottom-left-radius: 4px;
      }

      .message-role {
        display: block;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 6px;
        color: var(--muted);
      }

      .document-panel {
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        background: rgba(15, 25, 38, 0.78);
        padding: 14px 22px 12px;
      }

      .document-header {
        max-width: 920px;
        margin: 0 auto 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .document-header h2 {
        margin: 0;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }

      .document-count {
        color: var(--muted);
        font-size: 0.78rem;
      }

      .document-list {
        max-width: 920px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .document-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(17, 30, 44, 0.7);
        padding: 10px 12px;
      }

      .document-main {
        min-width: 0;
        flex: 1;
      }

      .document-name {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .document-meta {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.74rem;
      }

      .document-status {
        min-width: 78px;
        text-align: center;
        padding: 6px 8px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        border: 1px solid transparent;
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      .document-status:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }

      .document-status.active {
        background: rgba(126, 240, 199, 0.12);
        border-color: rgba(126, 240, 199, 0.35);
        color: var(--accent-2);
      }

      .document-status.inactive {
        background: rgba(255, 122, 122, 0.08);
        border-color: rgba(255, 122, 122, 0.26);
        color: #ffb8b8;
      }

      .empty-document {
        padding: 24px 10px;
        border: 1px dashed var(--border);
        border-radius: 12px;
        text-align: center;
        color: var(--muted);
      }

      .composer {
        border-top: 1px solid var(--border);
        padding: 16px 22px 20px;
        background: rgba(10, 15, 21, 0.72);
      }

      .composer-box {
        max-width: 920px;
        margin: 0 auto;
        display: flex;
        gap: 12px;
        align-items: center;
        border: 1px solid var(--border);
        background: rgba(17, 30, 44, 0.9);
        border-radius: 14px;
        padding: 10px 12px 10px 16px;
      }

      .composer-input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 1rem;
        min-width: 0;
      }

      .composer-input::placeholder {
        color: var(--muted);
      }

      .upload-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 10px;
        min-width: 150px;
      }

      .upload-icon {
        font-size: 1rem;
        line-height: 1;
      }

      .send-button {
        padding: 10px 16px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #06121d;
        font-weight: 800;
        cursor: pointer;
      }

      @media (max-width: 780px) {
        .sidebar {
          position: absolute;
          left: 0;
          top: 0;
          bottom: 0;
          transform: translateX(0);
        }

        .sidebar.collapsed {
          transform: translateX(-100%);
          width: 320px;
          min-width: 320px;
        }

        .main-panel {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <button class="brand-mark" id="toggleSidebar" type="button" aria-label="Expand sidebar">KB</button>
            <div class="brand-name">Knowledge Base</div>
          </div>
          <button class="icon-button" id="toggleSidebarSecondary" aria-label="Collapse sidebar">☰</button>
        </div>

        <div class="chat-toolbar">
          <button class="primary-button new-chat" id="newChatButton" type="button">
            <span>＋</span>
            <span class="new-chat-label">New chat</span>
          </button>
        </div>

        <div class="chat-list" id="chatList" aria-live="polite"></div>

        <div class="archived-section">
          <button class="archived-toggle" id="archivedToggle" type="button">Archived chats</button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="main-header">
          <div class="header-left">
            <div class="title-block">
              <span class="title-label">Active conversation</span>
              <span class="chat-name" id="selectedChatName">Select a chat</span>
            </div>
          </div>

          <div class="main-header-actions">
            <button class="view-toggle active" id="chatViewToggle" type="button">Chat</button>
            <button class="view-toggle" id="documentsViewToggle" type="button">Documents</button>
          </div>
        </header>

        <div class="main-body">
          <section class="conversation" id="conversationArea"></section>

          <section class="documents-view hidden" id="documentsView" aria-live="polite">
            <div class="document-panel">
              <div class="document-header">
                <h2>Uploaded documents</h2>
                <span id="documentCount" class="document-count">0 documents</span>
              </div>
              <div class="document-list" id="documentList"></div>
            </div>
          </section>

          <footer class="composer">
            <form class="composer-box" id="composerForm">
              <input type="file" id="documentInput" hidden />
              <input
                id="messageInput"
                class="composer-input"
                type="text"
                placeholder="Ask about your enterprise knowledge base..."
                autocomplete="off"
              />
              <button class="ghost-button upload-button" id="uploadDocumentButton" type="button">
                <span class="upload-icon" aria-hidden="true">📑</span>
                <span>Upload</span>
              </button>
              <button class="send-button" type="submit">Send</button>
            </form>
          </footer>
        </div>
      </main>
    </div>

    <script>
      const API_BASE = 'http://localhost:8000';
      const chatListEl = document.getElementById('chatList');
      const conversationEl = document.getElementById('conversationArea');
      const selectedChatNameEl = document.getElementById('selectedChatName');
      const sidebarEl = document.getElementById('sidebar');
      const messageInputEl = document.getElementById('messageInput');
      const documentListEl = document.getElementById('documentList');
      const documentCountEl = document.getElementById('documentCount');
      const documentInputEl = document.getElementById('documentInput');
      const uploadDocumentButtonEl = document.getElementById('uploadDocumentButton');
      const chatViewEl = document.getElementById('conversationArea');
      const documentsViewEl = document.getElementById('documentsView');
      const chatViewToggleEl = document.getElementById('chatViewToggle');
      const documentsViewToggleEl = document.getElementById('documentsViewToggle');

      const state = {
        chats: [],
        selectedChatId: null,
        page: 1,
        hasMore: true,
        isLoading: false,
        messageMap: {},
        messagePaging: {},
        archivedMode: false,
        documents: [],
        documentPage: 1,
        documentHasMore: true,
        documentLoading: false,
        activeView: 'chat',
        chatBusy: {},
      };

      function isNearBottom(container, threshold = 60) {
        return container.scrollHeight - (container.scrollTop + container.clientHeight) <= threshold;
      }

      function maybeLoadMoreChats() {
        if (state.hasMore && !state.isLoading && isNearBottom(chatListEl, 40)) {
          fetchChatsPage();
        }
      }

      function maybeLoadMoreMessages() {
        const selectedChat = getSelectedChat();
        if (!selectedChat) return;

        const messagePaging = getMessagePaging(selectedChat.id);
        if (!messagePaging.hasMore || messagePaging.isLoading) return;

        const nearTop = conversationEl.scrollTop <= 80;
        if (nearTop) {
          fetchMessagesForChat(selectedChat.id, false);
        }
      }

      function isConversationNearBottom(threshold = 120) {
        return conversationEl.scrollHeight - (conversationEl.scrollTop + conversationEl.clientHeight) <= threshold;
      }

      function syncComposerState() {
        const activeChatId = state.selectedChatId;
        const isBusy = Boolean(activeChatId && state.chatBusy[activeChatId]);
        messageInputEl.disabled = isBusy;
        document.getElementById('uploadDocumentButton').disabled = isBusy;
        document.querySelector('#composerForm button[type="submit"]').disabled = isBusy;
        messageInputEl.placeholder = isBusy ? 'Waiting for response...' : 'Ask about your enterprise knowledge base...';
      }

      function setChatBusy(chatId, nextState) {
        if (!chatId) return;

        if (nextState) {
          state.chatBusy[chatId] = true;
        } else {
          delete state.chatBusy[chatId];
        }

        syncComposerState();
      }

      function isChatBusy(chatId) {
        return Boolean(chatId && state.chatBusy[chatId]);
      }

      function maybeLoadMoreDocuments() {
        if (state.documentHasMore && !state.documentLoading && isNearBottom(documentsViewEl, 80)) {
          fetchDocumentsPage(false);
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function formatDate(dateString) {
        if (!dateString) return 'just now';
        return new Date(dateString).toLocaleDateString(undefined, {
          month: 'short',
          day: 'numeric',
          year: 'numeric',
        });
      }

      function setSelectedChat(chatId) {
        state.selectedChatId = chatId;

        const selected = state.chats.find((chat) => chat.id === chatId);
        selectedChatNameEl.textContent = selected ? selected.name : 'Select a chat';
        renderChatList();
        renderConversation();

        if (chatId) {
          fetchMessagesForChat(chatId, true);
        }
      }

      function renderChatList() {
        if (!state.chats.length) {
          chatListEl.innerHTML = '<div class="empty-state">No chats available yet.</div>';
          return;
        }

        chatListEl.innerHTML = state.chats
          .map((chat) => {
            const isActive = chat.id === state.selectedChatId;
            return `
              <div class="chat-item ${isActive ? 'active' : ''}" data-chat-id="${chat.id}">
                <div class="chat-summary" data-chat-id="${chat.id}">
                  <div class="chat-title">${escapeHtml(chat.name || 'Untitled chat')}</div>
                  <div class="chat-meta">${formatDate(chat.updated_at)} • ${chat.archived ? 'Archived' : 'Active'}</div>
                </div>
                <div class="chat-actions">
                  <button class="rename-btn" type="button" data-rename-id="${chat.id}" title="Rename chat">✎</button>
                  <button class="archive-btn" type="button" data-archive-id="${chat.id}" title="${chat.archived ? 'Unarchive chat' : 'Archive chat'}">${chat.archived ? '↺' : '📩'}</button>
                  <button class="delete-btn" type="button" data-delete-id="${chat.id}" title="Delete chat">🗑️</button>
                </div>
              </div>
            `;
          })
          .join('');
      }

      function normalizeMessages(rawMessages) {
        return (rawMessages || [])
          .filter((message) => message && typeof message.content === 'string')
          .map((message) => ({
            id: message.id,
            role: message.role || 'assistant',
            text: message.content,
            created_at: message.created_at,
          }))
          .sort((left, right) => new Date(left.created_at || 0) - new Date(right.created_at || 0));
      }

      function dedupeMessages(messages) {
        const uniqueById = new Map();
        for (const message of messages) {
          if (!message || typeof message !== 'object') continue;
          const key = message.id || `${message.role}:${message.text}:${message.created_at || 'unknown'}`;
          if (!uniqueById.has(key)) {
            uniqueById.set(key, message);
          }
        }

        return [...uniqueById.values()].sort(
          (left, right) => new Date(left.created_at || 0) - new Date(right.created_at || 0)
        );
      }

      function stripLocalDuplicates(chatId, incomingMessages) {
        const existing = state.messageMap[chatId] || [];
        const filtered = existing.filter((message) => {
          if (!String(message.id || '').startsWith('local-')) return true;

          const match = incomingMessages.some((incoming) => {
            if (!incoming || incoming.role !== message.role || incoming.text !== message.text) return false;

            const existingTime = new Date(message.created_at || 0).getTime();
            const incomingTime = new Date(incoming.created_at || 0).getTime();
            if (!existingTime || !incomingTime) return true;
            return Math.abs(existingTime - incomingTime) <= 60000;
          });

          return !match;
        });

        return filtered;
      }

      function appendMessage(chatId, message) {
        const chatMessages = state.messageMap[chatId] || [];
        const existingIndex = chatMessages.findIndex((item) => item.id === message.id);

        if (existingIndex >= 0) {
          chatMessages[existingIndex] = message;
        } else {
          chatMessages.push(message);
        }

        state.messageMap[chatId] = dedupeMessages(chatMessages);
        renderConversation();

        if (isConversationNearBottom(150)) {
          conversationEl.scrollTop = conversationEl.scrollHeight;
        }
      }

      function parseStreamPayload(rawText) {
        if (!rawText) return '';

        const lines = rawText.split(/\r?\n/);
        const payloadParts = [];

        for (const line of lines) {
          if (!line.trim()) continue;
          if (line.startsWith('data:')) {
            payloadParts.push(line.slice(5).trim());
          } else if (!line.startsWith(':')) {
            payloadParts.push(line.trim());
          }
        }

        return payloadParts.join('');
      }

      function renderConversation() {
        const selected = state.chats.find((chat) => chat.id === state.selectedChatId);
        if (!selected) {
          conversationEl.innerHTML = `
            <div class="message-list">
              <div class="empty-state">Choose a chat from the left panel or create a new one to start.</div>
            </div>
          `;
          return;
        }

        const messages = state.messageMap[selected.id] || [];

        if (!messages.length) {
          conversationEl.innerHTML = `
            <div class="message-list">
              <div class="empty-state">No messages yet. Start the conversation below.</div>
            </div>
          `;
          return;
        }

        conversationEl.innerHTML = `
          <div class="message-list">
            ${messages
              .map(
                (message) => `
                  <div class="message ${message.role}">
                    <span class="message-role">${message.role === 'user' ? 'You' : message.role === 'system' ? 'System' : 'Assistant'}</span>
                    <div>${escapeHtml(message.text || '')}</div>
                  </div>
                `,
              )
              .join('')}
          </div>
        `;
      }

      function renderActiveView() {
        const isChat = state.activeView === 'chat';
        chatViewEl.classList.toggle('hidden', !isChat);
        documentsViewEl.classList.toggle('hidden', isChat);
        chatViewToggleEl.classList.toggle('active', isChat);
        documentsViewToggleEl.classList.toggle('active', !isChat);
      }

      function renderDocuments() {
        documentCountEl.textContent = `${state.documents.length} document${state.documents.length === 1 ? '' : 's'}`;

        if (!state.documents.length) {
          documentListEl.innerHTML = '<div class="empty-document">No documents uploaded yet.</div>';
          return;
        }

        documentListEl.innerHTML = state.documents
          .map(
            (document) => `
              <div class="document-item" data-document-id="${document.id}">
                <div class="document-main">
                  <div class="document-name">${escapeHtml(document.filename || 'Untitled document')}</div>
                  <div class="document-meta">${formatDate(document.created_at)} • ${escapeHtml(document.status || 'uploaded')}</div>
                </div>
                <span
                  class="document-status ${document.active ? 'active' : 'inactive'}"
                  data-document-toggle="${document.id}"
                  tabindex="0"
                  role="button"
                  aria-pressed="${Boolean(document.active)}"
                  aria-label="Toggle document active state for ${escapeHtml(document.filename || 'Untitled document')}"
                >
                  ${document.active ? 'Active' : 'Inactive'}
                </span>
              </div>
            `,
          )
          .join('');
      }

      function getMessagePaging(chatId) {
        if (!state.messagePaging[chatId]) {
          state.messagePaging[chatId] = {
            before: null,
            hasMore: true,
            isLoading: false,
          };
        }

        return state.messagePaging[chatId];
      }

      function getOldestLoadedMessage(chatId) {
        const messages = state.messageMap[chatId] || [];
        if (!messages.length) return null;

        return [...messages].sort(
          (left, right) => new Date(left.created_at || 0) - new Date(right.created_at || 0)
        )[0];
      }

      async function fetchMessagesForChat(chatId, reset = false) {
        if (!chatId) return;

        const messagePaging = getMessagePaging(chatId);
        if (messagePaging.isLoading) return;
        if (!reset && !messagePaging.hasMore) return;

        messagePaging.isLoading = true;

        try {
          const params = new URLSearchParams({ limit: '10' });

          if (!reset && messagePaging.before) {
            params.set('before', messagePaging.before);
          }

          const response = await fetch(`${API_BASE}/chats/${chatId}/messages/?${params.toString()}`);
          if (!response.ok) {
            throw new Error('Failed to load chat messages');
          }

          const messages = await response.json();
          if (!Array.isArray(messages)) {
            throw new Error('Unexpected message response format');
          }

          if (!messages.length) {
            messagePaging.hasMore = false;
            if (reset) {
              state.messageMap[chatId] = [];
            }
            renderConversation();
            maybeLoadMoreMessages();
            return;
          }

          const normalized = normalizeMessages(messages);
          if (reset) {
            state.messageMap[chatId] = dedupeMessages(normalized);
          } else {
            const existing = stripLocalDuplicates(chatId, normalized);
            const merged = [...normalized, ...existing];
            state.messageMap[chatId] = dedupeMessages(merged);
          }

          const oldestLoaded = getOldestLoadedMessage(chatId);
          messagePaging.before = oldestLoaded ? oldestLoaded.created_at : null;
          messagePaging.hasMore = normalized.length >= 10;

          const previousScrollHeight = conversationEl.scrollHeight;
          renderConversation();
          if (reset) {
            conversationEl.scrollTop = conversationEl.scrollHeight;
          } else {
            const heightDelta = conversationEl.scrollHeight - previousScrollHeight;
            conversationEl.scrollTop += heightDelta;
          }
          maybeLoadMoreMessages();
        } catch (error) {
          console.error(error);
          if (reset) {
            state.messageMap[chatId] = [];
          }
          messagePaging.hasMore = false;
          renderConversation();
        } finally {
          messagePaging.isLoading = false;
        }
      }

      async function fetchChatsPage() {
        if (state.isLoading || !state.hasMore) return;

        state.isLoading = true;

        try {
          const response = await fetch(
            `${API_BASE}/chats/?page=${state.page}&page_size=20&archived=${state.archivedMode}`
          );
          if (!response.ok) {
            throw new Error('Failed to load chats');
          }

          const newChats = await response.json();
          if (!Array.isArray(newChats)) {
            throw new Error('Unexpected response format');
          }

          if (newChats.length === 0) {
            state.hasMore = false;
            renderChatList();
            return;
          }

          state.chats.push(...newChats);
          if (!state.selectedChatId && newChats[0]) {
            setSelectedChat(newChats[0].id);
          }

          state.hasMore = newChats.length >= 20;
          if (state.hasMore) {
            state.page += 1;
          }
          renderChatList();
        } catch (error) {
          console.error(error);
          state.hasMore = false;
          chatListEl.innerHTML = '<div class="empty-state">Unable to load chats right now.</div>';
        } finally {
          state.isLoading = false;
        }
      }

      async function fetchDocumentsPage(reset = false) {
        if (state.documentLoading || (!reset && !state.documentHasMore)) return;

        state.documentLoading = true;

        try {
          const page = reset ? 1 : state.documentPage;
          const response = await fetch(`${API_BASE}/documents/?page=${page}&page_size=15`);
          if (!response.ok) {
            throw new Error('Failed to load documents');
          }

          const documents = await response.json();
          if (!Array.isArray(documents)) {
            throw new Error('Unexpected document response format');
          }

          if (reset) {
            state.documents = documents;
            state.documentPage = 2;
          } else {
            state.documents.push(...documents);
            state.documentPage += 1;
          }

          state.documentHasMore = documents.length >= 15;
          renderDocuments();
        } catch (error) {
          console.error(error);
          state.documentHasMore = false;
          documentListEl.innerHTML = '<div class="empty-document">Unable to load documents right now.</div>';
        } finally {
          state.documentLoading = false;
        }
      }

      async function createChat(name) {
        const response = await fetch(`${API_BASE}/chats/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, archived: false }),
        });

        if (!response.ok) {
          throw new Error('Chat creation failed');
        }

        const createdChat = await response.json();
        state.chats.unshift(createdChat);
        state.page = Math.max(state.page, 2);
        setSelectedChat(createdChat.id);
        renderChatList();
      }

      async function renameChat(chatId, newName) {
        const response = await fetch(`${API_BASE}/chats/${chatId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: newName }),
        });

        if (!response.ok) {
          throw new Error('Chat rename failed');
        }

        const updatedChat = await response.json();
        const index = state.chats.findIndex((chat) => chat.id === chatId);
        if (index >= 0) {
          state.chats[index] = updatedChat;
        }
        if (state.selectedChatId === chatId) {
          selectedChatNameEl.textContent = updatedChat.name;
        }
        renderChatList();
        renderConversation();
      }

      async function archiveChat(chatId) {
        const chat = state.chats.find((item) => item.id === chatId);
        if (!chat) return;

        const response = await fetch(`${API_BASE}/chats/${chatId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ archived: !chat.archived }),
        });

        if (!response.ok) {
          throw new Error('Chat archive failed');
        }

        const updatedChat = await response.json();
        const index = state.chats.findIndex((item) => item.id === chatId);
        if (index >= 0) {
          state.chats[index] = updatedChat;
        }
        renderChatList();
      }

      async function deleteChat(chatId) {
        const confirmed = window.confirm('Delete this chat permanently?');
        if (!confirmed) return;

        const response = await fetch(`${API_BASE}/chats/${chatId}`, {
          method: 'DELETE',
        });

        if (!response.ok) {
          throw new Error('Chat delete failed');
        }

        state.chats = state.chats.filter((chat) => chat.id !== chatId);
        if (state.selectedChatId === chatId) {
          state.selectedChatId = state.chats[0]?.id || null;
          selectedChatNameEl.textContent = state.selectedChatId ? state.chats[0].name : 'Select a chat';
        }
        renderChatList();
        renderConversation();
      }

      function getSelectedChat() {
        return state.chats.find((chat) => chat.id === state.selectedChatId) || null;
      }

      async function ensureChatSelected() {
        if (state.selectedChatId) {
          const selected = state.chats.find((chat) => chat.id === state.selectedChatId);
          if (selected) return selected;
        }

        const fallbackName = 'New Chat';
        const response = await fetch(`${API_BASE}/chats/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: fallbackName, archived: false }),
        });

        if (!response.ok) {
          throw new Error('Chat creation failed');
        }

        const createdChat = await response.json();
        state.chats.unshift(createdChat);
        state.page = Math.max(state.page, 2);
        setSelectedChat(createdChat.id);
        renderChatList();
        return createdChat;
      }

      async function postUserMessage(chatId, content) {
        if (isChatBusy(chatId)) {
          throw new Error('This chat is already receiving a response.');
        }

        setChatBusy(chatId, true);

        try {
          const userMessage = {
            id: `local-user-${Date.now()}-${Math.random().toString(16).slice(2)}`,
            role: 'user',
            text: content,
            created_at: new Date().toISOString(),
          };

          appendMessage(chatId, userMessage);

          const assistantMessage = {
            id: `local-system-${Date.now()}-${Math.random().toString(16).slice(2)}`,
            role: 'system',
            text: '',
            created_at: new Date().toISOString(),
          };

          appendMessage(chatId, assistantMessage);

          const response = await fetch(`${API_BASE}/chats/${chatId}/messages/`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Accept: 'text/event-stream',
            },
            body: JSON.stringify({ message: content }),
          });

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.detail || 'Message creation failed');
          }

          const reader = response.body?.getReader();
          if (!reader) {
            throw new Error('Response body is not readable');
          }

          const decoder = new TextDecoder();
          let buffer = '';

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const chunks = buffer.split(/\n\n/);
            buffer = chunks.pop() || '';

            for (const chunk of chunks) {
              const payload = parseStreamPayload(chunk);
              if (!payload) continue;

              assistantMessage.text += payload;
              appendMessage(chatId, { ...assistantMessage, text: assistantMessage.text });
            }

            if (isConversationNearBottom(150)) {
              conversationEl.scrollTop = conversationEl.scrollHeight;
            }
          }

          const finalPayload = parseStreamPayload(buffer);
          if (finalPayload) {
            assistantMessage.text += finalPayload;
            appendMessage(chatId, { ...assistantMessage, text: assistantMessage.text });
          }

          assistantMessage.role = 'assistant';
          appendMessage(chatId, { ...assistantMessage, text: assistantMessage.text });

          const messagePaging = getMessagePaging(chatId);
          messagePaging.before = null;
          messagePaging.beforeId = null;
          messagePaging.hasMore = true;
        } finally {
          setChatBusy(chatId, false);
        }
      }

      async function uploadDocument(file) {
        try {
          const selectedChat = await ensureChatSelected();
          if (isChatBusy(selectedChat.id)) {
            window.alert('This chat is already receiving a response. Please wait for it to finish.');
            return;
          }

          const formData = new FormData();
          formData.append('file', file);

          const response = await fetch(`${API_BASE}/documents/`, {
            method: 'POST',
            body: formData,
          });

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.detail || 'Document upload failed');
          }

          const uploadedDocument = await response.json();
          state.documents = [uploadedDocument, ...state.documents.filter((doc) => doc.id !== uploadedDocument.id)];
          renderDocuments();

          await postUserMessage(selectedChat.id, `${file.name} was uploaded`);
          documentInputEl.value = '';
        } catch (error) {
          console.error(error);
          window.alert('The document could not be uploaded.');
        }
      }

      async function toggleDocumentActiveStatus(documentId) {
        const document = state.documents.find((item) => item.id === documentId);
        if (!document) return;

        try {
          const response = await fetch(`${API_BASE}/documents/${documentId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ active: !document.active }),
          });

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.detail || 'Document update failed');
          }

          const updatedDocument = await response.json();
          state.documents = state.documents.map((item) => (item.id === documentId ? updatedDocument : item));
          renderDocuments();
        } catch (error) {
          console.error(error);
          window.alert('The document state could not be updated.');
        }
      }

      function refreshChatsList() {
        state.chats = [];
        state.page = 1;
        state.hasMore = true;
        state.selectedChatId = null;
        selectedChatNameEl.textContent = 'Select a chat';
        renderChatList();
        fetchChatsPage();
      }

      document.getElementById('archivedToggle').addEventListener('click', () => {
        state.archivedMode = !state.archivedMode;
        const button = document.getElementById('archivedToggle');
        button.textContent = state.archivedMode ? 'Back to active chats' : 'Archived chats';
        refreshChatsList();
      });

      chatViewToggleEl.addEventListener('click', () => {
        state.activeView = 'chat';
        renderActiveView();
      });

      documentsViewToggleEl.addEventListener('click', () => {
        state.activeView = 'documents';
        renderActiveView();
      });

      document.getElementById('newChatButton').addEventListener('click', async () => {
        const name = window.prompt('Name your new chat', 'New RAG thread');
        if (!name || !name.trim()) return;

        try {
          await createChat(name.trim());
        } catch (error) {
          console.error(error);
          window.alert('New chat could not be created.');
        }
      });

      chatListEl.addEventListener('click', (event) => {
        const renameButton = event.target.closest('[data-rename-id]');
        const archiveButton = event.target.closest('[data-archive-id]');
        const deleteButton = event.target.closest('[data-delete-id]');
        const chatItem = event.target.closest('[data-chat-id]');

        if (renameButton) {
          const chatId = renameButton.getAttribute('data-rename-id');
          const chat = state.chats.find((item) => item.id === chatId);
          if (!chat) return;
          const nextName = window.prompt('Rename chat', chat.name);
          if (!nextName || !nextName.trim()) return;
          renameChat(chatId, nextName.trim());
          return;
        }

        if (archiveButton) {
          const chatId = archiveButton.getAttribute('data-archive-id');
          archiveChat(chatId);
          return;
        }

        if (deleteButton) {
          const chatId = deleteButton.getAttribute('data-delete-id');
          deleteChat(chatId);
          return;
        }

        if (chatItem) {
          const chatId = chatItem.getAttribute('data-chat-id');
          if (chatId) {
            setSelectedChat(chatId);
          }
        }
      });

      documentListEl.addEventListener('click', (event) => {
        const toggle = event.target.closest('[data-document-toggle]');
        if (!toggle) return;
        toggleDocumentActiveStatus(toggle.getAttribute('data-document-toggle'));
      });

      documentListEl.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        const toggle = event.target.closest('[data-document-toggle]');
        if (!toggle) return;
        event.preventDefault();
        toggleDocumentActiveStatus(toggle.getAttribute('data-document-toggle'));
      });

      chatListEl.addEventListener('scroll', () => {
        maybeLoadMoreChats();
      });

      conversationEl.addEventListener('scroll', () => {
        maybeLoadMoreMessages();
      });

      documentsViewEl.addEventListener('scroll', () => {
        maybeLoadMoreDocuments();
      });

      function toggleSidebar(forceExpand) {
        const shouldExpand = typeof forceExpand === 'boolean' ? forceExpand : !sidebarEl.classList.contains('collapsed');
        sidebarEl.classList.toggle('collapsed', !shouldExpand);
      }

      document.getElementById('toggleSidebar').addEventListener('click', () => {
        if (sidebarEl.classList.contains('collapsed')) {
          toggleSidebar(true);
        }
      });

      document.getElementById('toggleSidebarSecondary').addEventListener('click', () => {
        toggleSidebar(false);
      });

      uploadDocumentButtonEl.addEventListener('click', () => {
        documentInputEl.click();
      });

      documentInputEl.addEventListener('change', (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        uploadDocument(file);
      });

      document.getElementById('composerForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const text = messageInputEl.value.trim();
        if (!text) return;

        try {
          const selectedChat = await ensureChatSelected();
          if (isChatBusy(selectedChat.id)) {
            window.alert('This chat is already receiving a response. Please wait for it to finish.');
            return;
          }

          messageInputEl.value = '';
          await postUserMessage(selectedChat.id, text);
        } catch (error) {
          console.error(error);
          window.alert(error.message || 'Your message could not be sent.');
        }
      });

      renderActiveView();
      syncComposerState();
      fetchChatsPage();
      fetchDocumentsPage(true);
    </script>
  </body>
</html>
