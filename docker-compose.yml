services:
  api:
    build: ./app-server
    ports:
      - "8000:8000"
    volumes:
      - ./app-server:/app
    command: fastapi dev main.py --host 0.0.0.0 --port 8000

  minio:
    image: minio/minio:latest
    container_name: rag-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

    ports:
      - "9000:9000"
      - "9001:9001"
