services:
  api:
    container_name: rag-fastapi
    build: ./app-server
    ports:
      - "8000:8000"
      - "9465:9465"
    volumes:
      - ./app-server:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      OTEL_SERVICE_NAME: knowledge-base-api
      OTEL_PROMETHEUS_PORT: 9465
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: rag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  tempo:
    image: grafana/tempo:2.6.1
    container_name: rag-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200"
      - "4318:4318"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      # - tempo-data:/tmp/tempo

  loki:
    image: grafana/loki:3.5.0 # pin to a current 3.x
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
      # - loki-data:/loki
    ports: [ "3100:3100" ]

  alloy:
    image: grafana/alloy:latest # pin a version in practice
    command: run /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [ loki ]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: rag-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on: [ loki ]

  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d appdb" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: rag-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"

  document-extractor-and-chunker:
    container_name: rag-document-extractor-and-chunker
    build: ./workers/document-extractor-and-chunker
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: app
      DB_PASSWORD: app
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_SECURE: false
    command: python main.py
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  document-chunk-embedder:
    container_name: rag-document-chunk-embedder
    build: ./workers/document-chunk-embedder
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: app
      DB_PASSWORD: app
    command: python main.py
    depends_on:
      postgres:
        condition: service_healthy

# volumes:
#   tempo-data:

volumes:
  grafana-data:
