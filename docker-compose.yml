services:
  api:
    container_name: rag-fastapi
    build: ./app-server
    ports:
      - "8000:8000"
    volumes:
      - ./app-server:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    command: fastapi dev main.py --host 0.0.0.0 --port 8000

  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d appdb" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: rag-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"

  document-extractor-and-chunker:
    container_name: rag-document-extractor-and-chunker
    build: ./workers/document-extractor-and-chunker
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: app
      DB_PASSWORD: app
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_SECURE: false
    command: python main.py
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  document-chunk-embedder:
    container_name: rag-document-chunk-embedder
    build: ./workers/document-chunk-embedder
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: appdb
      DB_USER: app
      DB_PASSWORD: app
    command: python main.py
    depends_on:
      postgres:
        condition: service_healthy
